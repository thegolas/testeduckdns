<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Thegolas Gateway & API</title>
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      background-color: #0d1117;
      color: #c9d1d9;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      margin: 0;
    }
    .container {
      background-color: #161b22;
      border: 1px solid #30363d;
      border-radius: 12px;
      padding: 40px;
      max-width: 500px;
      text-align: center;
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.5);
    }
    h1 {
      color: #58a6ff;
      margin-bottom: 10px;
      font-size: 1.8rem;
    }
    p {
      color: #8b949e;
      font-size: 1rem;
      line-height: 1.5;
    }
    .badge {
      display: inline-block;
      background-color: #238636;
      color: #ffffff;
      padding: 6px 12px;
      border-radius: 20px;
      font-size: 0.85rem;
      font-weight: bold;
      margin-top: 15px;
      margin-bottom: 25px;
    }
    .api-btn {
      display: inline-block;
      background-color: #1f6feb;
      color: #ffffff;
      text-decoration: none;
      padding: 10px 20px;
      border-radius: 6px;
      font-weight: 600;
      transition: background-color 0.2s;
    }
    .api-btn:hover {
      background-color: #388bfd;
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>Gateway & Origin Server</h1>
    <p>Página principal rodando no <strong>GitHub Pages</strong> e servida via <strong>Azion Edge Firewall</strong>.</p>
    
    <div class="badge">● System Online (200 OK)</div>
    
    <br>
    <a href="/api/status.json" class="api-btn" target="_blank">Testar Endpoint API</a>
  </div>
</body>
</html>
